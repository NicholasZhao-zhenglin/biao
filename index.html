<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#192a36" />
    <title>标衡 · 投标项目工作台</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/match-panel.css" />
  </head>
  <body>
    <aside class="rail">
      <a class="brand" href="#matrix" aria-label="标衡项目工作台"
        ><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>标衡</span
        ><small>BIDCHECK</small></a
      >
      <div class="rail-group">
        <p>投标工作区</p>
        <button data-action="projects"><i data-icon="projects"></i>项目库</button>
        <button data-action="files"><i data-icon="files"></i>项目文件</button
        ><button data-action="materials"><i data-icon="layers"></i>企业材料</button>
      </div>
      <nav class="rail-group" aria-label="项目流程">
        <p>当前项目</p>
        <button data-view="matrix"><i data-icon="matrix"></i>响应矩阵</button>
        <button data-view="writing"><i data-icon="write"></i>标书编写</button>
        <button data-view="review"><i data-icon="check"></i>定稿审核</button>
      </nav>
      <div class="rail-foot">
        <button data-action="help"><i data-icon="help"></i>使用说明</button
        ><span><i class="live-dot"></i>本机工作区</span>
      </div>
    </aside>
    <div class="shell">
      <header class="bar">
        <div class="breadcrumb">
          <button data-action="projects">项目库</button><span>/</span
          ><strong id="breadcrumb">响应矩阵</strong>
        </div>
        <div class="runtime">
          <button class="model-status" id="model-status" data-action="model-info">
            <i data-icon="sparkle"></i>模型设置</button
          ><button class="save-status" id="save-status" data-action="save-info" aria-live="polite">
            正在读取项目…
          </button>
        </div>
      </header>
      <main id="workspace" aria-live="off"><div class="splash">正在打开工作区…</div></main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <input type="file" id="restore-file" accept=".json,application/json" hidden />
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
